name: Test Suite

on:
  push:
    branches: [ "2.0" ]
  pull_request:
    branches: [ "2.0" ]

jobs:
  deterministic:
    name: Deterministic non-browser gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Check generated artifacts are up to date
        run: bun run stylesheet:check

      - name: Run Elm tests
        run: bun run test
